<!DOCTYPE html>
<html lang="en">
<head>

<title>FLoC 2026 — ITP · CAV · IJCAR</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0d1117;
     color:#c9d1d9;font-size:13px;line-height:1.4}

/* ── Sticky banner ─────────────────────────────────────────────────── */
.banner{position:sticky;top:0;z-index:100;background:#161b22;
        border-bottom:1px solid #30363d}
.top-row{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
         padding:.6rem 1.2rem}
.site-title{font-size:1rem;font-weight:700;color:#e6edf3;flex:1}
.site-title small{color:#6e7681;font-weight:400;font-size:.78rem}
.clock{font-family:monospace;font-size:.8rem;color:#8b949e;white-space:nowrap}
.clock b{color:#e6edf3}
.tab-row{display:flex;gap:.4rem;flex-wrap:wrap;padding:.45rem 1.2rem;
         border-top:1px solid #21262d;align-items:center}
.tab{padding:.28rem .8rem;border-radius:5px;border:1px solid #30363d;
     background:transparent;color:#8b949e;cursor:pointer;
     font-size:.75rem;font-family:inherit;
     transition:background .12s,color .12s,border-color .12s}
.tab:hover{background:#21262d;color:#c9d1d9}
.tab.on{background:#1c3050;border-color:#1f6feb;color:#58a6ff;font-weight:600}
.jump-btn{margin-left:auto;padding:.28rem .8rem;border-radius:5px;
          border:1px solid #21880050;background:transparent;color:#3fb950;
          cursor:pointer;font-size:.75rem;font-family:inherit}
.jump-btn:hover{background:#0d2416;border-color:#3fb950}

/* ── Three columns ─────────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:1fr 1fr 1fr}
.col{border-right:1px solid #21262d}
.col:last-child{border-right:none}
.col-head{padding:.55rem 1rem;text-align:center;font-weight:700;
          font-size:.9rem;letter-spacing:.04em;border-bottom:2px solid;
          position:sticky;z-index:50}
.ci .col-head{color:#58a6ff;border-color:#1f6feb;background:#0d1117}
.cc .col-head{color:#ffa657;border-color:#bd561d;background:#0d1117}
.cj .col-head{color:#56d364;border-color:#238636;background:#0d1117}
.col-body{padding:.4rem}

/* ── Session cards ─────────────────────────────────────────────────── */
.s{border-radius:5px;border:1px solid transparent;margin-bottom:.35rem;
   overflow:hidden;transition:opacity .25s,border-color .25s,box-shadow .25s}
.s-hd{padding:.5rem .65rem}
.s-tm{font-family:monospace;font-size:.67rem;color:#484f58;margin-bottom:.12rem}
.s-ti{font-weight:600;font-size:.79rem;color:#c9d1d9;line-height:1.3}
.s-rm{font-size:.67rem;color:#484f58;margin-top:.15rem}
.s-talks{border-top:1px solid rgba(255,255,255,.05)}
.talk{padding:.3rem .65rem;border-bottom:1px solid rgba(255,255,255,.04);
      font-size:.72rem;color:#8b949e;line-height:1.3}
.talk:last-child{border-bottom:none}
.talk-t{font-family:monospace;font-size:.67rem;color:#484f58;margin-right:.3rem}

/* type colours */
.sk{background:#160e2a;border-color:#6e40c9}
.sk .s-ti{color:#d2a8ff}
.sk .s-tm{color:#9a6ee8}

.si{background:#0b1c34;border-color:#155da4}
.si .s-ti{color:#79c0ff}
.si .s-tm{color:#4184c4}

.sp{background:#0d1117;border-color:#21262d}
.sp .s-ti{color:#c9d1d9}

.sb{background:#0b0d10;border-color:#161b22}
.sb .s-ti{color:#3d4249;font-weight:400}
.sb .s-tm{color:#21262d}

.ss{background:#0d1f18;border-color:#1a4428}
.ss .s-ti{color:#56d364}
.ss .s-tm{color:#3fb950}

.sa{background:#1a1400;border-color:#7d5a00}
.sa .s-ti{color:#e3b341}
.sa .s-tm{color:#b08800}

.sx{background:#1a0f00;border-color:#6a3700}
.sx .s-ti{color:#ffa657;font-style:italic}

.sn{background:#0b0d10;border-color:#1a1f2a;opacity:.6}
.sn .s-ti{color:#3d4249;font-style:italic}
.sn .s-tm{color:#21262d}

/* states */
.s.past{opacity:.28}
.s.past.sb{opacity:.12}
.s.now{opacity:1!important;border-color:#d29922!important;
        box-shadow:0 0 0 1px #d2992230,0 2px 12px #d2992215}
.s.now .s-tm{color:#d29922!important}

.pill{display:inline-block;background:#d29922;color:#0d1117;
      font-size:.58rem;font-weight:800;padding:.05rem .28rem;
      border-radius:3px;margin-left:.35rem;vertical-align:middle;
      letter-spacing:.06em}

.nodata-link{padding:.3rem .65rem .45rem;font-size:.7rem}
.nodata-link a{color:#1f6feb;text-decoration:none}
.nodata-link a:hover{text-decoration:underline}

@media(max-width:740px){
  .grid{grid-template-columns:1fr}
  .col{border-right:none;border-bottom:1px solid #21262d}
}

// ─────────────────────────────────────────────────────────────────────────────
//  Utilities
// ─────────────────────────────────────────────────────────────────────────────
const p2  = n => String(n).padStart(2,'0');
const toMin = hm => hm[0]*60+hm[1];
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function lisbonNow(){
  const now = new Date();
  const fmt = new Intl.DateTimeFormat('en-GB',{
    timeZone:'Europe/Lisbon',hour12:false,
    year:'numeric',month:'numeric',day:'numeric',
    hour:'numeric',minute:'numeric'
  });
  const p = Object.fromEntries(fmt.formatToParts(now).map(x=>[x.type,x.value]));
  let h = parseInt(p.hour,10);
  if(h===24)h=0;
  return{Y:parseInt(p.year,10),M:parseInt(p.month,10),D:parseInt(p.day,10),
         h,m:parseInt(p.minute,10)};
}

function dayIdx(lt){
  for(let i=0;i<DATES.length;i++){
    if(lt.Y===DATES[i][0]&&lt.M===DATES[i][1]&&lt.D===DATES[i][2])return i;
  }
  return -1;
}

// ─────────────────────────────────────────────────────────────────────────────
//  Render
// ─────────────────────────────────────────────────────────────────────────────
let curDay = 0;

function render(){
  const lt      = lisbonNow();
  const todayI  = dayIdx(lt);
  const nowMin  = lt.h*60+lt.m;

  document.getElementById('clk').textContent = `${p2(lt.h)}:${p2(lt.m)}`;

  for(const conf of ['itp','cav','ijcar']){
    const sessions = DATA[conf][curDay];
    const isToday  = todayI === curDay;
    let html = '';

    for(let i=0;i<sessions.length;i++){
      const ses = sessions[i];
      const sm = toMin(ses.s), em = toMin(ses.e);
      const active = isToday && nowMin>=sm && nowMin<em;
      const past   = isToday && nowMin>=em;

      const ts    = `${p2(ses.s[0])}:${p2(ses.s[1])} – ${p2(ses.e[0])}:${p2(ses.e[1])}`;
      const badge = active ? '<span class="pill">NOW</span>' : '';
      const rm    = ses.rm ? `<div class="s-rm">📍 ${esc(ses.rm)}</div>` : '';

      let talks = '';
      if(ses.talks.length){
        talks = '<div class="s-talks">'
          + ses.talks.map(t=>
              `<div class="talk"><span class="talk-t">${esc(t.t)}</span>${esc(t.n)}</div>`
            ).join('')
          + '</div>';
      }

      let ndLink = '';
      if(ses.c==='sn'){
        const url=`https://program.floc26.org/${conf.toUpperCase()}-index`;
        ndLink=`<div class="nodata-link">
          <a href="${url}" target="_blank" rel="noopener">View full schedule at floc26.org ↗</a>
        </div>`;
      }

      html += `<div class="s ${ses.c}${active?' now':''}${past?' past':''}">
        <div class="s-hd">
          <div class="s-tm">${ts}</div>
          <div class="s-ti">${esc(ses.ti)}${badge}</div>${rm}
        </div>${talks}${ndLink}
      </div>`;
    }
    document.getElementById(`b-${conf}`).innerHTML = html;
  }

  // Tab active state
  document.querySelectorAll('.tab').forEach(b=>{
    b.classList.toggle('on', +b.dataset.d===curDay);
  });

  // Pin column headers just below the sticky banner
  const bh = document.getElementById('banner').getBoundingClientRect().height;
  document.querySelectorAll('.col-head').forEach(h=>{ h.style.top = bh+'px'; });
}

function setDay(d){
  curDay=d;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function jumpNow(){
  const ti = dayIdx(lisbonNow());
  if(ti<0){alert('The conference is not running today.');return;}
  curDay=ti;
  render();
  setTimeout(()=>{
    const el=document.querySelector('.s.now');
    if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
  },60);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
const bootDay = dayIdx(lisbonNow());
curDay = bootDay >= 0 ? bootDay : 0;
render();
setInterval(render, 30000); // refresh every 30 s
</script>
